name: validate

on:
  push:
  pull_request:

jobs:
  schema-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Validate NOTICE
        run: python tools/notice_validator.py
      - name: Validate License
        run: python tools/check_license.py
      - name: Validate License Hash
        run: python tools/check_license_hash.py
      - name: Release check
        run: python tools/release_check.py
      - name: Run tests
        run: pytest -q
